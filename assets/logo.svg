<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <radialGradient id="moon" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#b8b2a7"/>
      <stop offset="55%" stop-color="#8a8276"/>
      <stop offset="100%" stop-color="#4d473e"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9e4da"/>
      <stop offset="100%" stop-color="#b9b3a6"/>
    </linearGradient>
  </defs>

  <!-- orbit -->
  <ellipse cx="118" cy="90" rx="92" ry="44" fill="none" stroke="#6b6456" stroke-width="2" stroke-dasharray="3 7" opacity="0.65" transform="rotate(-18 118 90)"/>

  <!-- Phobos: small, irregular, cratered moon -->
  <g transform="translate(118 90)">
    <path d="M -34 -8
             C -40 -28, -16 -40, 6 -36
             C 30 -32, 44 -16, 40 6
             C 36 30, 14 42, -10 38
             C -34 34, -28 12, -34 -8 Z"
          fill="url(#moon)" stroke="#2f2b25" stroke-width="2"/>
    <!-- craters -->
    <ellipse cx="-6" cy="-6" rx="11" ry="9" fill="#3f3a32" opacity="0.55"/>
    <ellipse cx="-6" cy="-6" rx="11" ry="9" fill="none" stroke="#cdc6b8" stroke-width="1.2" opacity="0.4"/>
    <circle cx="16" cy="12" r="5.5" fill="#3f3a32" opacity="0.5"/>
    <circle cx="-20" cy="16" r="3.5" fill="#3f3a32" opacity="0.5"/>
    <circle cx="20" cy="-14" r="3" fill="#3f3a32" opacity="0.45"/>
  </g>

  <!-- wordmark -->
  <text x="248" y="92" font-size="58" font-weight="700" fill="url(#ink)" letter-spacing="-1">phobos</text>
  <text x="250" y="124" font-size="17" font-weight="400" fill="#9b9485" letter-spacing="1.5">a lean moonraker, in zig</text>
  <text x="250" y="150" font-size="12.5" fill="#7d7669" letter-spacing="0.5">100% API · ARM Cortex-A7 · static musl</text>
</svg>
