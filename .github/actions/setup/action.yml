name: Toolchain
description: Install the pinned Zig compiler and locked Python tooling
runs:
  using: composite
  steps:
    - shell: bash
      run: scripts/setup-ci-zig.sh
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: '3.12'
        enable-cache: false
